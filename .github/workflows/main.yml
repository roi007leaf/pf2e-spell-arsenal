name: PF2e Spell Arsenal Release Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate module manifest
        run: |
          jq -e '.id == "pf2e-spell-arsenal" and (.version | type == "string")' module.json
          test "$(jq -r .version module.json)" = "$(jq -r .version package.json)"
          jq -r '.esmodules[], .styles[]' module.json | while IFS= read -r file; do test -f "$file"; done
      - name: Prepare release manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$version" = "$(jq -r .version module.json)"
          jq --arg version "$version" \
            --arg url "https://github.com/$REPOSITORY" \
            --arg manifest "https://github.com/$REPOSITORY/releases/latest/download/module.json" \
            --arg download "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/module.zip" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > release-manifest.json
          mv release-manifest.json module.json
      - name: Create module archive
        if: github.event_name == 'release'
        run: zip --recurse-paths module.zip module.json README.md LICENSE scripts/ styles/ docs/
      - name: Upload release files
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" module.json module.zip --clobber

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release' && github.event.release.prerelease != true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish to Foundry VTT
        env:
          FVTT_API_TOKEN: ${{ secrets.FVTT_API_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$FVTT_API_TOKEN" ]; then
            echo "Foundry publishing skipped: FVTT_API_TOKEN is not configured."
            exit 0
          fi
          jq --arg version "${RELEASE_TAG#v}" \
            --arg manifest "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/module.json" \
            --arg notes "https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG" \
            '{id: .id, "dry-run": false, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: .compatibility}}' \
            module.json > foundry-release.json
          curl --fail-with-body --silent --show-error \
            -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" \
            -H "Authorization: $FVTT_API_TOKEN" \
            --data-binary @foundry-release.json
